<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Coding</title>
    <link rel="stylesheet" href="../style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="live-coding-canvas"></canvas>
    <textarea id="live-coding-editor" spellcheck="false">
function main(x, y, width, height, time) {
  // Create a rotation matrix
  const angle = time * 0.5;
  const rot = mat2(cos(angle), -sin(angle), sin(angle), cos(angle));

  // Normalize coordinates and apply rotation
  let uv = sub(vec2(x, y), vec2(width / 2, height / 2));
  uv = mult(rot, uv);
  uv = add(uv, vec2(width / 2, height / 2));
  uv = div(uv, vec2(width, height));

  // Animate colors
  const r = 0.5 + 0.5 * cos(time * 2.0 + uv.x * 10.0);
  const g = 0.5 + 0.5 * sin(time * 1.0 + uv.y * 10.0);
  const b = 0.5 + 0.5 * cos(time * 3.0 + (uv.x + uv.y) * 5.0);

  return vec4(r, g, b, 1.0);
}</textarea
    >
    <button id="run-button">Run</button>
    <div
      id="preset-container"
      style="position: fixed; bottom: 60px; left: 16px"
    >
      <div class="control-group">
        <label for="preset-select">Presets:</label>
        <select id="preset-select"></select>
      </div>
      <div
        id="resolution-container"
        class="control-group"
        style="display: none"
      >
        <label for="resolution-select">Resolution:</label>
        <select id="resolution-select">
          <option value="1">Full</option>
          <option value="0.5" selected>Half</option>
          <option value="0.25">Quarter</option>
        </select>
      </div>
      <div class="control-group">
        <label for="mode-toggle">Use WebGL:</label>
        <input type="checkbox" id="mode-toggle" />
      </div>
    </div>
    <div
      id="loading-indicator"
      style="
        display: none;
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        color: white;
        font-family: 'VT323', monospace;
      "
    >
      Compiling...
    </div>

    <div id="help-dialog" class="modal-overlay">
      <div class="modal-content">
        <button id="close-help" class="close-button">&times;</button>
        <h2>Available Functions & Variables</h2>
        <div id="help-content"></div>
      </div>
    </div>

    <script src="math-lib.js"></script>
    <script src="shader-presets.js"></script>
    <script src="glsl-presets.js"></script>
    <script src="live-coding.js"></script>
  </body>
</html>
