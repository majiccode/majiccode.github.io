<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Coding</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="live-coding-canvas"></canvas>
    <header>
      <div class="logo">.codebase</div>
    </header>
    <div class="container">
      <aside class="left-panel">
        <nav class="side-nav">
          <a href="../index.html#/">Home</a>
          <a href="../index.html#/about">About</a>
          <a href="../index.html#/contact">Contact</a>
          <a href="../index.html#/projects">Projects</a>
          <a href="live-coding.html">Live Coding</a>
        </nav>
      </aside>
      <main id="app" class="live-coding-main">
        <canvas id="offscreenCanvas" style="display: none"></canvas>
        <textarea id="live-coding-editor" spellcheck="false"> </textarea>
      </main>
    </div>

    <div id="slider-popup">
      <label for="slider">Adjust value: </label>
      <input type="range" id="slider" min="0" max="1" step="0.1" value="0.3" />
      <span id="slider-value"></span>
    </div>

    <div id="live-coding-controls">
      <button id="run-button">Run</button>
      <div id="preset-container">
        <div class="control-group">
          <label for="preset-select">Presets:</label>
          <select id="preset-select"></select>
        </div>
        <div
          id="resolution-container"
          class="control-group"
          style="display: none"
        >
          <label for="resolution-select">Resolution:</label>
          <select id="resolution-select">
            <option value="1">Full</option>
            <option value="0.5" selected>Half</option>
            <option value="0.25">Quarter</option>
          </select>
        </div>
        <div class="control-group">
          <label for="mode-toggle">Use WebGL:</label>
          <input type="checkbox" id="mode-toggle" />
        </div>
      </div>
      <div
        id="loading-indicator"
        style="display: none; color: white; font-family: 'VT323', monospace"
      >
        Compiling...
      </div>
    </div>

    <div id="help-dialog" class="modal-overlay">
      <div class="modal-content">
        <button id="close-help" class="close-button">&times;</button>
        <h2>Available Functions & Variables</h2>
        <div id="help-content"></div>
      </div>
    </div>

    <script src="math-lib.js"></script>
    <script src="shader-presets.js"></script>
    <script src="glsl-presets.js"></script>
    <script src="live-coding.js"></script>
  </body>
</html>
